services:
  reverse_proxy:
    container_name: reverse_proxy
    image: nginx:1.29
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 81:81
    networks:
      - web_network
    depends_on:
      api:
        condition: service_started

  database:
    container_name: database
    image: mongo:6.0
    env_file:
      - ./configs/.env
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - 27017:27017
    volumes:
      - ./configs/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - dev_data:/data/db:rw
    networks:
      - database_network
    healthcheck:
      test: mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  database_test:
    container_name: database_test
    image: mongo:6.0
    env_file:
      - ./configs/.env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./configs/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - database_network
    healthcheck:
      test: mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    
  api:
    container_name: api
    image: node:23.8.0
    environment:
      - NODE_ENV=dev
      - MONGO_HOST=database
      - REDIS_HOST=whitelist
    env_file:
      - ./configs/.env
    networks:
      - web_network
      - database_network
    volumes:
      - ./api:/api:rw
      - ./logs:/logs:rw
      - ./keys:/keys:rw
    working_dir: /api
    command: bash -c "npm install && npm run dev"
    depends_on:
      database:
        condition: service_healthy
      whitelist:
        condition: service_healthy

  test:
    container_name: test
    image: node:23.8.0
    env_file:
      - ./configs/.env
    environment:
      - NODE_ENV=test
      - MONGO_HOST=database_test
      - REDIS_HOST=whitelist_test
    volumes:
      - ./api:/api:rw
      - ./logs:/logs:rw
      - ./keys/:/keys:rw
      - ./configs/vitest.config.js:/vitest.config.js:ro
    working_dir: /api
    command: bash -c "npm install && npm test"
    depends_on:
      database_test:
        condition: service_healthy
      whitelist_test:
        condition: service_healthy
    networks:
      - database_network

  whitelist:
    container_name: whitelist
    image: redis:8.0
    networks:
      - database_network
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
  
  whitelist_test:
    container_name: whitelist_test
    image: redis:8.0
    networks:
      - database_network
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  web_network:
    name: web_network
  database_network:
    name: database_network

volumes:
  dev_data:
