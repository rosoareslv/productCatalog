  <text x="355" y="774" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">🔄 Token refresh</text><text x="490.0" y="312" font-size="19" font-weight="700" fill="#334155" stroke="#FFFBF2" stroke-width="7" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">Send username and password</text><text x="490.0" y="338" font-size="19" font-weight="700" fill="#334155" stroke="#FFFBF2" stroke-width="7" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">(POST /auth/login)</text><line x1="260" y1="354" x2="708" y2="354" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-C)"/>
  <circle cx="260" cy="354" r="16" fill="#7C3AED" stroke="#fff" stroke-width="3"/>
