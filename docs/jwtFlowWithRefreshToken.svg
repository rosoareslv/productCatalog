  <circle cx="260" cy="946" r="16" fill="#7C3AED" stroke="#fff" stroke-width="3"/>
  <text x="260" y="952" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="490.0" y="1014" font-size="19" font-weight="700" fill="#334155" stroke="#FFE4EC" stroke-width="7" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">Return access_token and refresh_token</text><line x1="720" y1="1030" x2="272" y2="1030" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-A)" stroke-dasharray="9 7"/>
