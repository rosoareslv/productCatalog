  <circle cx="260" cy="1144" r="16" fill="#7C3AED" stroke="#fff" stroke-width="3"/>
  <text x="260" y="1150" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="700.0" y="1212" font-size="19" font-weight="700" fill="#334155" stroke="#FFFBF2" stroke-width="7" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">Return protected resource</text><line x1="1140" y1="1228" x2="272" y2="1228" stroke="#0EA5A4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-P)" stroke-dasharray="9 7"/>
  <circle cx="1140" cy="1228" r="16" fill="#0EA5A4" stroke="#fff" stroke-width="3"/>
