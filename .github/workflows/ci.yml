name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.8.0
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run lint:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.8.0

      - name: Generate JWT keys
        run: node scripts/generateKeys.js

      - name: Create .env
        run: |
          cat > configs/.env <<EOF
          EXPRESS_PORT=2000

          MONGO_INITDB_ROOT_USERNAME=ci_admin
          MONGO_INITDB_ROOT_PASSWORD=ci_admin

          MONGO_PORT=27017
          MONGO_HOST=database
          MONGO_DATABASE=catalogDB

          MONGO_OWNER_USER=ci_owner
          MONGO_OWNER_PASSWORD=ci_password

          MONGO_API_USER=ci_api_database
          MONGO_API_PASSWORD=ci_api_database_password

          REDIS_PORT=6379
          REDIS_HOST=whitelist

          TEST_USER=ci_user
          TEST_PASSWORD=ci_test_pwd
          EOF

      - name: Run tests
        run: docker compose run --rm test

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs database whitelist

      - name: Tear down
        if: always()
        run: docker compose down -v
